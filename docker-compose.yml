services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow

  inference-api:
    build:
      context: ./api/WindInference.Api
    environment:
      MODEL_BUNDLE_PATH: /models/penmanshiel-event-type-onnx/latest
    ports:
      - "8080:8080"
    volumes:
      - ./model_repository:/models:ro
