name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check src tests airflow

      - name: Run Python unit tests
        run: python -m pytest tests/python

  dotnet:
    name: .NET unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore api/WindInference.Api/WindInference.Api.sln

      - name: Build .NET solution
        run: dotnet build api/WindInference.Api/WindInference.Api.sln --configuration Release --no-restore

      - name: Run .NET unit tests
        run: dotnet test api/WindInference.Api/WindInference.Api.sln --configuration Release --no-build --verbosity normal
