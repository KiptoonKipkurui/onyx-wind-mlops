[project]
name = "wind-onnx-mlops-takehome"
version = "0.1.0"
description = "Wind turbine risk model training, ONNX export, MLflow tracking, and .NET inference API."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "mlflow>=2.12",
  "numpy>=1.24",
  "onnx>=1.15",
  "onnxruntime>=1.17",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "skl2onnx>=1.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]
airflow = [
  "apache-airflow>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
